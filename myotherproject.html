    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var revealItems = document.querySelectorAll(".reveal-up");
            var revealObserver = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("is-visible");
                        revealObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            revealItems.forEach(function (item) {
                revealObserver.observe(item);
            });

            var cursorDot = document.getElementById("cursorDot");
            if (cursorDot && window.matchMedia("(pointer: fine)").matches) {
                var mouseX = 0;
                var mouseY = 0;
                var rafPending = false;

                function updateCursorPosition() {
                    cursorDot.style.setProperty("--x", mouseX + "px");
                    cursorDot.style.setProperty("--y", mouseY + "px");
                    rafPending = false;
                }

                document.addEventListener("mousemove", function (e) {
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                    cursorDot.style.opacity = "1";

                    if (!rafPending) {
                        rafPending = true;
                        requestAnimationFrame(updateCursorPosition);
                    }
                });

                document.addEventListener("mouseleave", function () {
                    cursorDot.style.opacity = "0";
                });

                document.addEventListener("mouseover", function (e) {
                    var anchor = e.target.closest("a");
                    if (anchor) {
                        cursorDot.classList.add("cursor-dot-link");
                    }
                });

                document.addEventListener("mouseout", function (e) {
                    var anchor = e.target.closest("a");
                    if (anchor) {
                        cursorDot.classList.remove("cursor-dot-link");
                    }
                });
            }
        });
    </script>
